[package]
name = "strandscape"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "shape-run-cache", "wasm-web"] }
glam = "0.30"
thiserror = "2"
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "metal", "webgpu", "webgl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.103"
raw-window-handle = "0.6"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = ["AddEventListenerOptions", "console", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "MediaQueryList", "ResizeObserver", "Response", "Window"] }

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
opt-level = "s"
